<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ลงขายสินค้า - SECOND HAND</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-main: #F2F0EA;
            --card-bg: #EAE8E2;
            --ink: #17140F;
            --line: rgba(23, 20, 15, 0.12);
            --placeholder-bg: #FFFFFF;

            --green: #2E6A49;
            --green-dark: #1E4A33;
            --accent: #C24428;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-padding-top: 0;
            scroll-behavior: smooth;
        }

        html,
        body {
            margin: 0;
            background: var(--bg-main);
            color: var(--ink);
        }

        body {
            font-family: 'IBM Plex Sans Thai', sans-serif;
            font-size: 16px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        textarea {
            font-family: 'IBM Plex Sans Thai', sans-serif;
        }


        /* =========================================================
           NAVBAR
        ========================================================= */

        header {
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .wrap {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            gap: 24px;
        }

        nav ul {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 28px;
            margin: 0;
            padding: 0;
            flex-wrap: wrap;
        }

        nav a {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.02em;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s ease;
        }

        nav a:hover,
        nav a.active {
            border-bottom-color: var(--ink);
        }


        /* =========================================================
           SEARCH
        ========================================================= */

        .search-container {
            flex: 1;
            max-width: 380px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 8px 36px 8px 14px;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            font-size: 13px;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--line);
            border-radius: 4px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            background-color: #FFFFFF;
            border-color: var(--ink);
        }

        .search-button {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            opacity: 0.6;
            padding: 0;
        }

        .search-button:hover {
            opacity: 1;
        }

        .search-button svg {
            width: 16px;
            height: 16px;
        }


        /* =========================================================
           LOGO
        ========================================================= */

        .logo {
            font-family: 'Archivo Black', sans-serif;
            font-size: 22px;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            white-space: nowrap;
            color: var(--ink);
        }


        /* =========================================================
           MAIN CONTENT
        ========================================================= */

        section.block {
            padding: 64px 0;
            border-bottom: 1px solid var(--line);
        }

        .menu-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .menu-head h2 {
            font-family: 'Archivo Black', sans-serif;
            text-transform: uppercase;
            letter-spacing: -0.01em;
            margin: 0;
            font-size: clamp(30px, 4.2vw, 44px);
        }

        .market-note {
            max-width: 60ch;
            color: rgba(23, 20, 15, 0.75);
            margin-top: 18px;
        }


        /* =========================================================
           BUTTON
        ========================================================= */

        .post-btn {
            background: var(--green);
            color: #FFFFFF;
            border: none;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            font-weight: 700;
            font-size: 14px;
            padding: 10px 18px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .post-btn:hover,
        .post-btn:focus-visible {
            background: var(--green-dark);
        }

        .post-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        /* =========================================================
           SELL FORM
        ========================================================= */

        .post-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 14px;
        }

        .post-form label {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(23, 20, 15, 0.8);
        }

        .post-form input,
        .post-form textarea {
            width: 100%;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            font-size: 14px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            background: #FFFFFF;
            color: var(--ink);
            border-radius: 0;
        }

        .post-form input:focus,
        .post-form textarea:focus {
            outline: 2px solid var(--green);
            outline-offset: 1px;
        }

        .post-form textarea {
            resize: vertical;
        }

        .post-form input[type="file"] {
            cursor: pointer;
        }

        #postError {
            margin: 0;
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            padding: 56px 0 48px;
            background: var(--bg-main);
        }

        footer .stalk h2 {
            font-family: 'Archivo Black', sans-serif;
            text-transform: uppercase;
            color: var(--green);
            font-size: clamp(56px, 12vw, 140px);
            line-height: 0.9;
            margin: 0;
        }

        .social-list {
            list-style: none;
            margin: 28px 0 0;
            padding: 0;
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        .social-list a {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 15px;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .foot-bottom {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
            color: rgba(23, 20, 15, 0.6);
        }


        /* =========================================================
           FOCUS
        ========================================================= */

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 3px;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 840px) {

            .navbar {
                flex-wrap: wrap;
            }

            .search-container {
                order: 3;
                max-width: 100%;
                width: 100%;
            }
        }

        @media (max-width: 640px) {

            .wrap {
                padding: 0 20px;
            }

            .navbar {
                padding: 16px 0;
                gap: 16px;
            }

            nav ul {
                gap: 16px;
                flex-wrap: wrap;
            }

            nav a {
                font-size: 13px;
            }

            .logo {
                font-size: 18px;
            }

            section.block {
                padding: 48px 0;
            }
        }

        @media (max-width: 480px) {

            .logo {
                width: 100%;
                text-align: right;
            }
        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>

<body>


    <!-- =========================================================
         NAVBAR
    ========================================================= -->

    <header>

        <div class="wrap">

            <div class="navbar">

                <!-- LEFT NAV -->
                <nav aria-label="Main" id="mainNav">

                    <ul>

                        <li>
                            <a href="index.html">
                                MENU
                            </a>
                        </li>

                        <li>
                            <a href="buy.html">
                                ซื้อสินค้า
                            </a>
                        </li>

                        <li>
                            <a href="sell.html" class="active">
                                ลงขายสินค้า
                            </a>
                        </li>

                        <li>
                            <a href="orders.html">
                                ประวัติการสั่งซื้อ
                            </a>
                        </li>

                    </ul>

                </nav>


                <!-- SEARCH -->
                <form
                    class="search-container"
                    action="buy.html"
                    method="GET"
                >

                    <input
                        type="text"
                        name="q"
                        class="search-input"
                        placeholder="ค้นหาสินค้า..."
                        aria-label="ค้นหาสินค้า"
                    >

                    <button
                        type="submit"
                        class="search-button"
                        aria-label="ค้นหา"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >

                            <circle
                                cx="11"
                                cy="11"
                                r="7"
                            ></circle>

                            <line
                                x1="16.5"
                                y1="16.5"
                                x2="21"
                                y2="21"
                            ></line>

                        </svg>

                    </button>

                </form>


                <!-- LOGO -->
                <div class="logo">
                    SECOND HAND
                </div>

            </div>

        </div>

    </header>


    <!-- =========================================================
         SELL SECTION
    ========================================================= -->

    <section class="block">

        <div class="wrap">

            <div class="menu-head">

                <h2>
                    ลงขายสินค้า
                </h2>

                <button
                    class="post-btn"
                    onclick="window.location.href='buy.html'"
                >
                    ดูสินค้าที่ลงขาย
                </button>

            </div>


            <p class="market-note">
                วางขายของมือสองของคุณ เพื่อให้ผู้อื่นสามารถเข้ามาเลือกซื้อได้
            </p>


            <!-- SELL FORM -->

            <form
                id="postForm"
                class="post-form"
                style="max-width:720px;"
            >

                <label>
                    รูปสินค้า

                    <input
                        type="file"
                        accept="image/*"
                        id="pfImage"
                        required
                    >
                </label>


                <label>
                    ชื่อสินค้า

                    <input
                        type="text"
                        id="pfName"
                        required
                    >
                </label>


                <label>
                    ราคา (฿)

                    <input
                        type="text"
                        id="pfPrice"
                        required
                    >
                </label>


                <label>
                    รายละเอียด

                    <textarea
                        id="pfDesc"
                        rows="3"
                        required
                    ></textarea>
                </label>


                <label>
                    ชื่อผู้ขาย

                    <input
                        type="text"
                        id="pfSeller"
                        required
                    >
                </label>


                <label>
                    ช่องทางติดต่อ

                    <input
                        type="text"
                        id="pfContact"
                        placeholder="LINE / IG"
                        required
                    >
                </label>


                <button
                    type="submit"
                    class="post-btn"
                    id="postSubmitBtn"
                >
                    ลงขาย
                </button>


                <p
                    class="market-note"
                    id="postError"
                    style="display:none; color:#C24428;"
                ></p>

            </form>

        </div>

    </section>


    <!-- =========================================================
         FOOTER
    ========================================================= -->

    <footer>

        <div class="wrap">

            <div class="stalk">
                <h2>
                    Stalk us
                </h2>
            </div>


            <ul class="social-list">

                <li>
                    <a href="#" onclick="return false;">
                        Instagram
                    </a>
                </li>

                <li>
                    <a href="#" onclick="return false;">
                        TikTok
                    </a>
                </li>

                <li>
                    <a href="#" onclick="return false;">
                        Facebook
                    </a>
                </li>

                <li>
                    <a href="#" onclick="return false;">
                        Line
                    </a>
                </li>

            </ul>


            <div class="foot-bottom">

                <span>
                    &copy; 2026 Nham
                </span>

                <span>
                    Bangkok, Thailand
                </span>

            </div>

        </div>

    </footer>


    <!-- =========================================================
         SELL SCRIPT
    ========================================================= -->

    <script>

        let db = null;
        let assetsApi = null;


        async function setupSellPage() {

            try {
                db = await claude.use('db');
            } catch (e) {
                db = null;
            }


            try {
                assetsApi = await claude.use('assets');
            } catch (e) {
                assetsApi = null;
            }

        }


        document
            .getElementById('postForm')
            .addEventListener('submit', async function (e) {

                e.preventDefault();


                const errEl =
                    document.getElementById('postError');

                errEl.style.display = 'none';


                const fileInput =
                    document.getElementById('pfImage');

                const file =
                    fileInput.files[0];


                if (!file) {

                    errEl.textContent =
                        'กรุณาเลือกรูปสินค้า';

                    errEl.style.display =
                        'block';

                    return;
                }


                if (!db) {

                    errEl.textContent =
                        'การลงขายสินค้าใช้ได้เมื่อเปิดหน้านี้ผ่าน claude.ai';

                    errEl.style.display =
                        'block';

                    return;
                }


                const btn =
                    document.getElementById('postSubmitBtn');


                btn.disabled = true;

                btn.textContent =
                    'กำลังลงขาย...';


                try {

                    let imageUrl = '';


                    if (assetsApi) {

                        const res =
                            await assetsApi.upload(file);

                        imageUrl =
                            res.url;

                    } else {

                        imageUrl =
                            await new Promise(
                                (resolve, reject) => {

                                    const reader =
                                        new FileReader();

                                    reader.onload =
                                        () => resolve(
                                            reader.result
                                        );

                                    reader.onerror =
                                        reject;

                                    reader.readAsDataURL(
                                        file
                                    );

                                }
                            );
                    }


                    const name =
                        document
                            .getElementById('pfName')
                            .value
                            .trim();


                    const price =
                        document
                            .getElementById('pfPrice')
                            .value
                            .trim();


                    const desc =
                        document
                            .getElementById('pfDesc')
                            .value
                            .trim();


                    const sellerName =
                        document
                            .getElementById('pfSeller')
                            .value
                            .trim();


                    const contact =
                        document
                            .getElementById('pfContact')
                            .value
                            .trim();


                    await db
                        .collection('products')
                        .add({

                            name: name,

                            price:
                                price.startsWith('฿')
                                    ? price
                                    : ('฿' + price),

                            desc: desc,

                            image: imageUrl,

                            sellerName:
                                sellerName,

                            sellerMeta:
                                'โพสต์เมื่อ ' +
                                new Date()
                                    .toLocaleDateString(
                                        'th-TH'
                                    ),

                            sellerContact:
                                contact,

                            status:
                                'available',

                            createdAt:
                                Date.now()

                        });


                    document
                        .getElementById('postForm')
                        .reset();


                    alert(
                        'ลงขายสินค้าเรียบร้อยแล้ว'
                    );

                } catch (err) {

                    console.error(err);


                    errEl.textContent =
                        'ลงขายไม่สำเร็จ ลองใหม่อีกครั้ง';

                    errEl.style.display =
                        'block';

                } finally {

                    btn.disabled = false;

                    btn.textContent =
                        'ลงขาย';

                }

            });


        setupSellPage();

    </script>

</body>

</html>
